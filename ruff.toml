# Standard ruff-konfigurasjon som følger med tests/test_lint.py når den
# kopieres mellom Python-repoer. Regelsettet er satt så komplett som praktisk
# mulig: både `ruff check` med bredt regelsett og `ruff format --check`.
# Se "## Ruff-nivå" i tests/test_lint.py.

target-version = "py39"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "PT",
    "PERF",
    "FURB",
    "PL",
    "RUF",
    "S",
    "ARG",
    "C90",
    "PTH",
    "DTZ",
    "ERA",
]

# Regler som er utelatt fra det brede regelsettet:
# - S603 og S607 er bandit-audit-regler som varsler på hvert eneste
#   underprosesskall uavhengig av tillit, og gir mer støy enn nytte i
#   CLI-verktøy som tilsiktet kjører eksterne kommandoer. Øvrige S-regler,
#   inkludert S602 (shell=True) og S608 (SQL-bygging), beholdes.
# - PLR2004 krever at tallverdier i sammenligninger navngis som konstanter.
#   Det er et nivåvalg som bør avklares med den som eier kravet (se
#   "## Ruff-nivå" i tests/test_lint.py) før det tas inn, ikke noe som bør
#   avgjøres stille i denne leveransen.
ignore = [
    "PLR2004",
    "S603",
    "S607",
]

[lint.per-file-ignores]
# `assert` er selve testmekanismen i pytest, og testdata inneholder bevisst
# oppdiktede passord.
"tests/**" = ["S101", "S105"]
"test/**" = ["S101", "S105"]

[format]
quote-style = "double"
indent-style = "space"
